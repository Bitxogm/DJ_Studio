services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beatforge_db}
      POSTGRES_USER: ${POSTGRES_USER:-beatforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      # Host remapeado a 5433: el 5432 del host ya está en uso por otro servicio.
      # El puerto interno del contenedor (usado por backend vía red Docker) sigue en 5432.
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-beatforge} -d ${POSTGRES_DB:-beatforge_db}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3001}
      # Se construye a partir de POSTGRES_* en vez de heredar DATABASE_URL del .env:
      # ese valor está pensado para procesos en el host (localhost:5434), no para la
      # red interna de Docker, donde postgres se resuelve por nombre de servicio.
      DATABASE_URL: postgresql://${POSTGRES_USER:-beatforge}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-beatforge_db}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      UPLOAD_DIR: ${UPLOAD_DIR:-./uploads}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./packages/shared/src:/app/packages/shared/src
      # UPLOAD_DIR (./uploads) es relativo al cwd del proceso (WORKDIR de este stage).
      - uploads_data_dev:/app/apps/backend/uploads
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:${PORT:-3001}/api/health',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      # Nombre de servicio en la red interna de Docker, no localhost: los Route
      # Handlers corren en el contenedor del frontend, no en el navegador.
      BACKEND_INTERNAL_URL: http://backend:3001
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src
      - ./packages/shared/src:/app/packages/shared/src
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data_dev:
  uploads_data_dev:
