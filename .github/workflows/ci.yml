name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build shared
        run: pnpm --filter @beatforge/shared build

      - name: Build backend
        run: pnpm --filter @beatforge/backend build

      # Frontend build requires NEXT_PUBLIC_API_URL to avoid undefined env vars
      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: pnpm --filter @beatforge/frontend build
